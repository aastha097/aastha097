<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="Cute animated cat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.4s ease-in-out infinite alternate}
    @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
    .head{animation:bob 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s infinite}
    @keyframes ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-10deg)}95%{transform:rotate(4deg)}}
    .h{opacity:0;transform-box:fill-box;transform-origin:center;animation:rise 3.2s ease-out infinite}
    .h2{animation-delay:1.1s}.h3{animation-delay:2.1s}
    @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1)}}
  </style>
  <ellipse cx="110" cy="190" rx="58" ry="6" fill="#000" opacity=".12"/>
  <path class="tail" d="M150 152 C192 152 202 112 178 98" stroke="#F2C08F" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="110" cy="148" rx="46" ry="35" fill="#FFD9B0"/>
  <ellipse cx="90" cy="178" rx="15" ry="9" fill="#FFD9B0"/>
  <ellipse cx="130" cy="178" rx="15" ry="9" fill="#FFD9B0"/>
  <g transform="translate(110,132)">
    <path d="M0 0 L-14 -8 L-14 8 Z" fill="#7B2FF7"/>
    <path d="M0 0 L14 -8 L14 8 Z" fill="#7B2FF7"/>
    <circle r="4.5" fill="#00E5FF"/>
  </g>
  <g class="head">
    <g class="ear"><path d="M78 66 L82 30 L106 54 Z" fill="#FFD9B0"/><path d="M84 58 L85 42 L97 54 Z" fill="#FFA8C0"/></g>
    <path d="M142 66 L138 30 L114 54 Z" fill="#FFD9B0"/><path d="M136 58 L135 42 L123 54 Z" fill="#FFA8C0"/>
    <circle cx="110" cy="88" r="40" fill="#FFD9B0"/>
    <path d="M110 50 L104 62 M110 50 L116 62" stroke="#F2C08F" stroke-width="3" stroke-linecap="round"/>
    <g class="blink"><ellipse cx="94" cy="88" rx="5.5" ry="7.5" fill="#2B2B3A"/><circle cx="92.5" cy="85" r="2" fill="#fff"/></g>
    <g class="blink"><ellipse cx="126" cy="88" rx="5.5" ry="7.5" fill="#2B2B3A"/><circle cx="124.5" cy="85" r="2" fill="#fff"/></g>
    <circle cx="82" cy="102" r="7" fill="#FFA8C0" opacity=".6"/>
    <circle cx="138" cy="102" r="7" fill="#FFA8C0" opacity=".6"/>
    <path d="M106 99 L114 99 L110 104 Z" fill="#FF7FA1"/>
    <path d="M110 104 Q105 112 99 107 M110 104 Q115 112 121 107" stroke="#2B2B3A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M78 100 L56 95 M78 105 L56 108 M142 100 L164 95 M142 105 L164 108" stroke="#8A6F5A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(176,58)"><path class="h" d="M0 0 C-6 -8 -16 0 0 12 C16 0 6 -8 0 0Z" fill="#FF7FA1"/></g>
  <g transform="translate(44,52)"><path class="h h2" d="M0 0 C-6 -8 -16 0 0 12 C16 0 6 -8 0 0Z" fill="#7B2FF7"/></g>
