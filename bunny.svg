<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" height="90" role="img" aria-label="Bunny hopping across the page" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .run{animation:run 9s linear infinite}
    @keyframes run{from{transform:translateX(-70px)}to{transform:translateX(830px)}}
    .hop{animation:hop .6s ease-in-out infinite}
    @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    .ear{transform-box:fill-box;transform-origin:50% 100%;animation:flap .6s ease-in-out infinite alternate}
    @keyframes flap{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
  </style>
  <line x1="0" y1="82" x2="800" y2="82" stroke="#7B2FF7" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>
  <g class="run"><g class="hop">
    <circle cx="8" cy="66" r="6" fill="#fff" stroke="#C9B6FF" stroke-width="1.5"/>
    <ellipse cx="30" cy="66" rx="21" ry="13" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/>
    <ellipse cx="22" cy="79" rx="8" ry="3.5" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/>
    <ellipse cx="42" cy="79" rx="6" ry="3.5" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/>
    <g class="ear"><ellipse cx="46" cy="32" rx="4.5" ry="14" transform="rotate(-10 46 32)" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/><ellipse cx="46" cy="33" rx="2" ry="9" transform="rotate(-10 46 33)" fill="#FFA8C0"/></g>
    <g class="ear"><ellipse cx="55" cy="32" rx="4.5" ry="14" transform="rotate(10 55 32)" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/><ellipse cx="55" cy="33" rx="2" ry="9" transform="rotate(10 55 33)" fill="#FFA8C0"/></g>
    <circle cx="50" cy="54" r="12" fill="#F3EEFF" stroke="#C9B6FF" stroke-width="1.5"/>
    <circle cx="54" cy="51" r="1.9" fill="#2B2B3A"/>
    <circle cx="57" cy="57" r="3.2" fill="#FFA8C0" opacity=".7"/>
    <circle cx="61" cy="55" r="1.7" fill="#FF7FA1"/>
  </g></g>
</svg>
